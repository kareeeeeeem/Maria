name: churchapp
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  animate_do: ^4.2.0
  animated_toggle_switch: ^0.8.5
  badges: ^3.1.2
  cached_network_image: ^3.4.1
  calendar_agenda: ^0.0.2+3
  camera: ^0.11.2
  carousel_slider: ^5.1.1
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.3
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  desktop_webview_auth: ^0.0.16
  dio: ^5.9.0
  dotted_dashed_line: ^0.0.3
  firebase_analytics_web: ^0.6.0+3
  firebase_auth: ^6.1.1
  firebase_auth_web: ^6.1.0
  firebase_core: ^4.2.0
  firebase_core_web: ^3.2.0
  firebase_messaging: ^16.0.3
  firebase_messaging_web: ^4.0.3
  firebase_storage: ^13.0.3
  firebase_storage_web: ^3.10.21
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_facebook_auth: ^6.0.4
  flutter_html: ^3.0.0
  flutter_local_notifications: ^19.5.0
  flutter_native_splash: ^2.3.1
  font_awesome_flutter: ^10.12.0
  geocoding: ^4.0.0
  gh_pages: ^0.1.1
  google_generative_ai: ^0.4.7
  google_sign_in: ^7.2.0
  hive_flutter: ^1.1.0
  html_unescape: ^2.0.0
  http: ^1.5.0
  image: ^4.5.4
  image_picker: ^1.2.1
  intl: ^0.17.0
  intl_phone_field: ^3.2.0
  liquid_swipe: ^3.1.0
  lottie: ^3.3.2
  mask_text_input_formatter: ^2.9.0
  onesignal_flutter: ^5.3.4
  path_provider: ^2.1.5
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  printing: ^5.14.2
  readmore: ^3.0.0
  rename_app: ^1.6.5
  saver_gallery: ^4.0.1
  shared_preferences: ^2.5.3
  shorebird_code_push: ^2.0.5
  sign_in_with_apple: ^7.0.1
  simple_circular_progress_bar: ^1.0.2
  sqflite: ^2.4.2
  supabase_flutter: ^2.10.3
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  vibration: ^3.1.4
  video_player: ^2.10.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
# pubspec.yaml
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png" # 👈 يجب أن يكون هكذا
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png" # 👈 أيضاً يجب تحديث مسار الـ web
    background_color: "#FFFFFF" # يمكنك وضع لون خلفية الويب
    theme_color: "#000000" # يمكنك وضع لون الثيم
  windows:
    generate: true
    image_path: "assets/images/app_icon.png" # 👈 و مسار الـ windows
    icon_size: 48

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#010101"
  image: assets/images/app_logo.png
  android_12:
    color: "#ffffff"
    color_dark: "#010101"
    image: assets/images/app_logo.png
  android: true
  ios: true

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/ar_svd.json
    - assets/verses.txt
    - shorebird.yaml

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
