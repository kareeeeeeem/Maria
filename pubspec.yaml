  flutter_launcher_icons: ^0.14.4
# pubspec.yaml

# ...
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png" # 👈 يجب أن يكون هكذا
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png" # 👈 أيضاً يجب تحديث مسار الـ web
    background_color: "#FFFFFF" # يمكنك وضع لون خلفية الويب
    theme_color: "#000000"      # يمكنك وضع لون الثيم
  windows:
    generate: true
    image_path: "assets/images/app_icon.png" # 👈 و مسار الـ windows
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon.png" # 👈 و مسار الـ macos

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#010101"
  image: assets/images/app_logo.png
  android_12:
    color: "#ffffff"
    color_dark: "#010101"
    image: assets/images/app_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
